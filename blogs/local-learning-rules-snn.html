    <script>
        (function () {
            var total = 73;
            var current = 1;
            var basePath = '/blogs/images/local_learning_slides/slide-';
            var img = document.getElementById('slideImg');
            var prevBtn = document.getElementById('prevSlide');
            var nextBtn = document.getElementById('nextSlide');
            var slider = document.getElementById('slideSlider');
            var currentLabel = document.getElementById('slideCurrent');
            var slideshow = document.getElementById('slideshow');
            var fullscreenBtn = document.getElementById('fullscreenBtn');

            if (!img) return;

            function slideSrc(n) {
                var num = n < 10 ? '0' + n : '' + n;
                return basePath + num + '.png';
            }

            function preload(n) {
                if (n < 1 || n > total) return;
                var pre = new Image();
                pre.src = slideSrc(n);
            }

            function render() {
                img.classList.add('is-loading');
                img.src = slideSrc(current);
                img.alt = 'Slide ' + current + ' of ' + total;
                currentLabel.textContent = current;
                slider.value = current;
                prevBtn.disabled = current <= 1;
                nextBtn.disabled = current >= total;
                preload(current + 1);
                preload(current - 1);
            }

            img.addEventListener('load', function () {
                img.classList.remove('is-loading');
            });

            function goTo(n) {
                current = Math.min(total, Math.max(1, n));
                render();
            }

            prevBtn.addEventListener('click', function () { goTo(current - 1); });
            nextBtn.addEventListener('click', function () { goTo(current + 1); });
            slider.addEventListener('input', function () { goTo(parseInt(slider.value, 10)); });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowRight') { goTo(current + 1); }
                else if (e.key === 'ArrowLeft') { goTo(current - 1); }
            });

            var touchStartX = null;
            slideshow.addEventListener('touchstart', function (e) {
                touchStartX = e.changedTouches[0].clientX;
            }, { passive: true });
            slideshow.addEventListener('touchend', function (e) {
                if (touchStartX === null) return;
                var dx = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(dx) > 40) {
                    if (dx < 0) { goTo(current + 1); } else { goTo(current - 1); }
                }
                touchStartX = null;
            });

            function isSlideshowFullscreen() {
                var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
                return fsEl === slideshow;
            }

            function updateFullscreenBtn() {
                var active = isSlideshowFullscreen();
                fullscreenBtn.innerHTML = '<i class="fa-solid fa-' + (active ? 'compress' : 'expand') + '"></i>';
                fullscreenBtn.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
            }

            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', function () {
                    if (!isSlideshowFullscreen()) {
                        var request = slideshow.requestFullscreen || slideshow.webkitRequestFullscreen;
                        if (request) request.call(slideshow);
                    } else {
                        var exit = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exit) exit.call(document);
                    }
                });

                document.addEventListener('fullscreenchange', updateFullscreenBtn);
                document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

                document.addEventListener('keydown', function (e) {
                    if (e.key === 'f' || e.key === 'F') {
                        fullscreenBtn.click();
                    }
                });
            }

            render();
        })();
    </script>
